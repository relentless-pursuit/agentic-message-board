# Supported topology: ONE application instance, PostgreSQL and a durable database queue.
# docker compose -f docker-compose.scale.yml up --build
# Multiple coordinators are intentionally outside this deployment contract.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentboard
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-reviewer-password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d agentboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent-board:
    build: .
    image: agent-board:local
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      BOARD_BIND: 0.0.0.0
      PORT: 8080
      BOARD_QUEUE: database
      BOARD_ROLE: all
      AGENTS_DIR: /app/agents-local
      DB_URL: jdbc:postgresql://postgres:5432/agentboard
      DB_USER: board
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-reviewer-password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BOARD_OPENAI_MODEL: ${BOARD_OPENAI_MODEL:-gpt-5.4-nano}
      BOARD_OPENAI_BUDGET_USD: ${BOARD_OPENAI_BUDGET_USD:-5}
      BOARD_OPENAI_MAX_CALLS: ${BOARD_OPENAI_MAX_CALLS:-1000}
      # Shared deployments always require a board token.
      BOARD_AUTH: ${BOARD_AUTH:-token}
      BOARD_ADMIN_TOKEN: ${BOARD_ADMIN_TOKEN:-}
      BOARD_PUBLIC_URL: ${BOARD_PUBLIC_URL:-http://127.0.0.1:8087}
    volumes:
      - board-data:/app/data
      - board-agents:/app/agents-local
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pg-data:
  board-data:
  board-agents:
