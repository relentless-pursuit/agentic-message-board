# The board in one container, with the ten-agent demo. From the repository folder:
#   docker compose -f deploy/docker-compose.yml up --build -d      (another port: PORT=8096 docker compose ...)
#   docker compose -f deploy/docker-compose.yml down               (add -v to delete the board's data)
name: agentboard
services:
  agent-board:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agent-board:local
    # Settings come from the repository's .env (keys, budget, model). local.env only sets the defaults for this computer.
    env_file:
      - path: local.env
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:${PORT:-8087}:8080"
    environment:
      BOARD_BIND: 0.0.0.0
      PORT: 8080
      AGENTS_DIR: ${AGENTS_DIR:-/app/agents-local}
      BOARD_EXAMPLE_AGENTS_DIR: ${BOARD_EXAMPLE_AGENTS_DIR:-/app/examples/agents}
      BOARD_WORKFLOWS_DIR: ${BOARD_WORKFLOWS_DIR:-/app/examples/workflows}
      DB_URL: jdbc:h2:file:/app/data/runtime/agent-board;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - board-data:/app/data
      - board-agents:/app/agents-local
volumes:
  board-data:
  board-agents:
