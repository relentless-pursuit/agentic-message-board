# Copy to .github/workflows/docdrift.yml in the repository whose docs you want to keep current.
# On every pull request it checks the docs against the code change and shows outdated places as warnings on the PR.
name: docdrift
on: pull_request
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # DocDrift lives in the Agent Board repository. It is private, so this checkout needs a token that can read it.
      - uses: actions/checkout@v4
        with: { repository: relentless-pursuit/problem-1-6-agentic-message-board, path: .agentboard, token: "${{ secrets.DOCDRIFT_READ_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # OPENAI_API_KEY is optional: with it, OpenAI judges each place; without it, the offline rules do.
      - run: python .agentboard/src/docdrift check --repo . --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --github-annotations --out docdrift-report
        env: { OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}" }
      - uses: actions/upload-artifact@v4
        with: { name: docdrift-report, path: docdrift-report }
