# Supported topology: ONE application instance, PostgreSQL and a durable database queue.
# docker compose -f deploy/docker-compose.scale.yml up --build
# Multiple coordinators are intentionally outside this deployment contract.
name: agentboard-pg
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentboard
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-reviewer-password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d agentboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent-board:
    # Settings come from the repository's .env. A shared board needs a token by default (BOARD_AUTH=token).
    env_file:
      - path: ../.env
        required: false
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agent-board:local
    ports:
      - "127.0.0.1:${PORT:-8087}:8080"
    environment:
      BOARD_BIND: 0.0.0.0
      PORT: 8080
      BOARD_QUEUE: database
      BOARD_ROLE: all
      AGENTS_DIR: /app/agents-local
      BOARD_EXAMPLE_AGENTS_DIR: /app/examples/agents
      BOARD_WORKFLOWS_DIR: /app/examples/workflows
      DB_URL: jdbc:postgresql://postgres:5432/agentboard
      DB_USER: board
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-reviewer-password}
      BOARD_PUBLIC_URL: ${BOARD_PUBLIC_URL:-http://127.0.0.1:${PORT:-8087}}
    volumes:
      - board-data:/app/data
      - board-agents:/app/agents-local
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pg-data:
  board-data:
  board-agents:
