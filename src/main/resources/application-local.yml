server:
  address: 127.0.0.1
  port: ${PORT:8087}
board:
  # Local use: no board token for a browser on this computer. Set BOARD_AUTH=token to require one.
  auth: ${BOARD_AUTH:open}
  agents-dir: ./agents-local
  benchmark:
    enabled: false
  scheduler:
    enabled: false
  reasoning-provider: openai
  openai:
    budget-usd: ${BOARD_OPENAI_BUDGET_USD:1.0}
    max-calls: ${BOARD_OPENAI_MAX_CALLS:100}
    max-concurrent: 2
    request-spacing: 2s
