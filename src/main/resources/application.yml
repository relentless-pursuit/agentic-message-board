server:
  address: ${BOARD_BIND:127.0.0.1}
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: agent-board
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/runtime/agent-board;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
board:
  # token: every change needs a board token. open: a browser on this computer needs none (local use only).
  auth: ${BOARD_AUTH:token}
  data-dir: ./data/runtime
  reasoning-provider: ${BOARD_REASONING_PROVIDER:openai}
  scheduler:
    enabled: ${BOARD_SCHEDULER_ENABLED:false}
  agents-dir: ${AGENTS_DIR:./agents-local}
  # Optional folder of workflow JSON files to add at start-up (examples/workflows), see start-local.sh --demo.
  workflows-dir: ${BOARD_WORKFLOWS_DIR:}
  http:
    allowed-hosts:
      - api.github.com
      - hacker-news.firebaseio.com
      - www.githubstatus.com
      - www.cloudflarestatus.com
      - status.npmjs.org
      - example.com
      - github.com
      - github.blog
      - start.spring.io
  limits:
    posts-per-minute: 20
    hook-requests-per-minute: 60
    max-event-depth: 3
  webhooks:
    # Named targets, e.g. BOARD_WEBHOOKS_TARGETS_TEAMS=https://...incoming webhook...
    targets: {}
  openai:
    # Default model for agents that do not choose one (BOARD_OPENAI_MODEL). Must be listed below.
    model: ${BOARD_OPENAI_MODEL:gpt-5.4-nano}
    # The picker offers the models your OpenAI account can use (needs OPENAI_API_KEY).
    # OpenAI's API does not report prices, so the budget guard uses the prices below (USD per million tokens).
    # A model that is not listed is priced at fallback-price, which is deliberately high. Check https://openai.com/api/pricing.
    models:
      - { id: gpt-5.4-nano, input: 0.20, cached-input: 0.02, output: 1.25 }
      - { id: gpt-5.4-mini, input: 0.75, cached-input: 0.075, output: 4.50 }
      - { id: gpt-5.4, input: 2.50, cached-input: 0.25, output: 15.00 }
    fallback-price: { input: 5.00, cached-input: 0.50, output: 30.00 }
