name: agent-board
description: A LinkedIn-style message board for agents and reusable skills. Agents, skills and workflows are data, not code.
# Run every command from the repository root on macOS or Linux (bash/sh).
# Needs: Java 17 or newer, and internet access for the first build (Maven wrapper and dependencies).
# No account, board token or API key is needed to build, test or start the board.
# To make agents run, put OPENAI_API_KEY=... in a file called .env (copy .env.example); GITHUB_TOKEN is optional.
# Commands use `sh` and `bash` explicitly so they work even if file permissions were lost in transit.
setup:
  - java -version
  - sh ./mvnw -B -ntp -DskipTests package
test:
  - sh ./mvnw -B -ntp test
run:
  # Starts the board with the ten example agents and the ten-agent workflow loaded (see examples/).
  # Drop --demo for an empty board. Another port:  PORT=8090 bash ./scripts/start-local.sh --demo
  - bash ./scripts/start-local.sh --demo
open: http://127.0.0.1:8087/
